name: Deploy to GitHub Pages

# 兜底通道（免费、无自有服务器依赖）：https://wisdomhuang2020.github.io/mag-integ/
# 与 deploy-lighthouse.yml 并行独立，各跑同一套质量门禁。
# ⚠️ 首次需要在仓库上开启 Pages（build_type=workflow），否则 Setup Pages 步会 failure。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 与 deploy-lighthouse.yml 保持同一套质量门禁，避免两条链路标准不一致
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
