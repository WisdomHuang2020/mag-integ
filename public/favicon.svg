<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    磁集成 LLC 变压器设计工具 —— favicon
    造型：磁芯中柱 + 原副边绕组 + 气隙（本站首页主图标 BrandMark 的加粗版）。
    语义：一个磁芯上同时承载励磁电感与谐振电感 —— 这正是「磁集成」的定义。

    站群统一规范（与 llc / ahb / interleaved-pfc / widget / optical 一致）：
      深底 #0a0a0a / 主形 teal #14b8a6 / amber #f59e0b 仅标一处关键点。
      amber 落在中柱气隙处，代表磁路中刻意留出的那段气隙（决定 Lm 与 Lr 分配）。

    16px 可读性：四条短粗笔 + 一个点，结构对称。
    与姊妹站区分：llc 是谐振折线、AHB 是闪电、ipfc 是双横杠、
      widget 是空心方屏、optical 是灯泡 —— 本站是「磁芯 + 绕组」结构件。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- 磁芯中柱（上下两段，中间留作气隙） -->
  <rect x="14.6" y="6" width="2.8" height="7.4" rx="1.4" fill="#14b8a6"/>
  <rect x="14.6" y="18.6" width="2.8" height="7.4" rx="1.4" fill="#14b8a6"/>
  <!-- 左侧绕组（原边） -->
  <rect x="6" y="14.6" width="6" height="2.8" rx="1.4" fill="#14b8a6"/>
  <!-- 右侧绕组（副边） -->
  <rect x="20" y="14.6" width="6" height="2.8" rx="1.4" fill="#14b8a6"/>
  <!-- 气隙 -->
  <circle cx="16" cy="16" r="2.2" fill="#f59e0b"/>
</svg>
